spring.application.name=BMS

# Database Configuration (Supports Neon PostgreSQL & MySQL via environment variable)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/BMS?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234567890}

# JPA / Hibernate (Dialect is auto-detected by Hibernate 6 based on JDBC driver)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SQL Initialization disabled (tables and schemas are auto-managed by Hibernate JPA)
spring.sql.init.mode=never

# Server & CORS Configuration
server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}

# Spring Mail Configuration (Credentials provided via Environment Variables)
# If unconfigured, the application gracefully logs OTP to the console.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Stripe Configuration (Enter test or live keys via Environment Variables)
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_placeholder}

























